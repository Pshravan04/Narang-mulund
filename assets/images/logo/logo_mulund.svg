<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E46" />
      <stop offset="50%" stop-color="#E5C16C" />
      <stop offset="100%" stop-color="#9C7328" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5A9A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Left Side: Developer Icon & Branding -->
  <g transform="translate(15, 12)">
    <!-- Arch 1 (Outer) -->
    <path d="M 12 75 L 12 36 A 28 28 0 0 1 68 36 L 68 75" fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Arch 2 (Middle) -->
    <path d="M 23 75 L 23 37 A 17 17 0 0 1 57 37 L 57 75" fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Arch 3 (Inner) -->
    <path d="M 34 75 L 34 40 A 6 6 0 0 1 46 40 L 46 75" fill="none" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>

    <!-- Developer Text -->
    <text x="40" y="93" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="13" font-weight="700" letter-spacing="4" fill="#111827" text-anchor="middle">NARANG</text>
    <text x="40" y="106" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.5" fill="#4B5563" text-anchor="middle">DEVELOPERS</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="140" y1="15" x2="140" y2="125" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right Side: Project Branding -->
  <g transform="translate(160, 20)">
    <!-- Sub-label -->
    <text x="5" y="24" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" letter-spacing="5" fill="#0284C7">NARANG</text>
    
    <!-- Project Name -->
    <text x="4" y="66" font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Playfair Display', serif" font-size="40" font-weight="800" letter-spacing="4" fill="url(#goldGrad)">MULUND</text>
    
    <!-- Location Tagline -->
    <line x1="5" y1="80" x2="35" y2="80" stroke="#CA9E46" stroke-width="1.5"/>
    <text x="42" y="84" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#374151">SARVODAYA NAGAR, MULUND WEST</text>
    <line x1="332" y1="80" x2="362" y2="80" stroke="#CA9E46" stroke-width="1.5"/>
  </g>
</svg>
